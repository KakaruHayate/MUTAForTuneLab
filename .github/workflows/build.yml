name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  unit:
    name: unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: unit tests
        run: dotnet run --project tests/UnitTests/UnitTests.csproj -c Release

  build:
    name: pack ${{ matrix.rid }}
    needs: unit
    # Without a TuneLab download the job cannot compile at all; skip instead of going red
    # on every tag until the variable is set.
    if: vars.TUNELAB_SDK_URL != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            # DirectML build of ONNX Runtime 1.23 (pinned: 1.24 hangs on some drivers).
            complete: true
          - os: ubuntu-latest
            rid: linux-x64
            # WebGPU execution provider comes from the 1.31 package.
            complete: false
          - os: macos-latest
            rid: osx-x64
            complete: false
    runs-on: ${{ matrix.os }}
    # The native libraries are currently built with MSVC. Windows is the verified target;
    # the other two run to show what is missing rather than to publish a broken package.
    continue-on-error: ${{ !matrix.complete }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: native libraries
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tools/build-native.ps1

      - name: TuneLab SDK
        id: sdk
        shell: pwsh
        env:
          TUNELAB_SDK_URL: ${{ vars.TUNELAB_SDK_URL }}
        run: |
          $dir = & ./tools/fetch-tunelab.ps1
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: managed build
        shell: pwsh
        run: ./tools/build.ps1 -TuneLabDir "${{ steps.sdk.outputs.dir }}"

      - name: pack
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./tools/pack-tlx.ps1
          Move-Item artifacts/mutafortunelab.tlx "artifacts/mutafortunelab-${{ matrix.rid }}.tlx"

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'win-x64'
        with:
          name: tlx-${{ matrix.rid }}
          path: artifacts/mutafortunelab-*.tlx
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tlx-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tlx
          generate_release_notes: true
          prerelease: true
