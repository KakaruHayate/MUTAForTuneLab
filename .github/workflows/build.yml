name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  unit:
    name: unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: unit tests
        run: dotnet run --project tests/UnitTests/UnitTests.csproj -c Release

  build:
    name: pack ${{ matrix.rid }}
    needs: unit
    # Without a TuneLab download the job cannot compile at all; skip instead of going red
    # on every tag until the variable is set.
    if: vars.TUNELAB_SDK_URL != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the target the native libraries were first built for: ONNX Runtime
          # 1.23 with DirectML, pinned because 1.24 hangs on some drivers.
          - os: windows-latest
            rid: win-x64
          # Linux/macOS compile the same native libraries with the platform toolchain and
          # take the latest ONNX Runtime with the WebGPU plugin execution provider for R2.
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: native libraries
        shell: pwsh
        run: ./tools/build-native.ps1

      - name: TuneLab SDK
        id: sdk
        shell: pwsh
        env:
          TUNELAB_SDK_URL: ${{ vars.TUNELAB_SDK_URL }}
        run: |
          $dir = & ./tools/fetch-tunelab.ps1
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: managed build
        shell: pwsh
        run: ./tools/build.ps1 -TuneLabDir "${{ steps.sdk.outputs.dir }}"

      - name: pack
        shell: pwsh
        run: |
          ./tools/pack-tlx.ps1
          Move-Item artifacts/mutafortunelab.tlx "artifacts/mutafortunelab-${{ matrix.rid }}.tlx"
          ./tools/build.ps1 -Lite -TuneLabDir "${{ steps.sdk.outputs.dir }}"
          ./tools/pack-tlx.ps1 -Package artifacts/package-lite `
            -Output "artifacts/mutafortunelab-${{ matrix.rid }}-lite.tlx"

      - uses: actions/upload-artifact@v4
        with:
          name: tlx-${{ matrix.rid }}
          path: artifacts/mutafortunelab-*.tlx
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tlx-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tlx
          name: MUTA for TuneLab ${{ github.ref_name }}
          prerelease: false
          body: |
            An independent TuneLab voice plugin: it sings with MUTA voice banks through the
            built-in worldline vocoder and exposes the usual part, note and automation
            parameters. No MUTA binary or voice data is included.

            Each platform has a full build and a `-lite` build (worldline R1.1 only, no ONNX
            Runtime). Windows uses DirectML for R2; Linux and macOS use the WebGPU plugin
            execution provider.

            See [README](README.md) and [CHANGELOG](CHANGELOG.md).
